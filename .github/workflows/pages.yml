name: Deploy web game to GitHub Pages

# The playable web version lives in www/ (it's also the Capacitor web asset root).
# GitHub Pages can't serve a subfolder from a branch directly, so this workflow
# publishes www/ as the site root — keeping the canonical URL
# https://wickusmyburgh.github.io/Grapple-Frog/ pointing straight at the game.
#
# One-time setup: in the repo's Settings → Pages, set "Source" to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload www/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
